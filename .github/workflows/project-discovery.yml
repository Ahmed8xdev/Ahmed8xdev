name: Discover and describe public projects

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/project-discovery.yml'
      - 'scripts/update-projects.mjs'
  schedule:
    - cron: '45 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-repository-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
      - name: Scan public repositories and update profile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/update-projects.mjs
      - name: Commit updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECTS.md data/public-repositories.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh public-project showcase"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$((attempt * 2))"
            done
            exit 1
          fi
