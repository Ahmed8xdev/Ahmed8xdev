name: Render 3D contribution activity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/3d-activity.yml'
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-repository-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
      - name: Generate real 3D contribution visualization
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated visuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh 3D contribution graph"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$((attempt * 2))"
            done
            exit 1
          fi
