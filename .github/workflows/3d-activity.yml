name: Render 3D contribution activity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/3d-activity.yml'
  # Rebuild throughout the day so newly merged PRs appear promptly.
  # GitHub scheduled runs are best effort and may be delayed.
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-repository-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5
      - name: Generate real 3D contribution visualization
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Replace star and fork footer with actual commit and PR activity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/customize-3d-contrib.py
          python3 -m unittest discover -s tests -p 'test_customize_3d_contrib.py'
      - name: Validate the graph and refresh its README cache key
        shell: bash
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-night-rainbow.svg
          grep -q '<svg' profile-3d-contrib/profile-night-rainbow.svg
          # Avoid unnecessary bot commits when the contribution data is identical.
          if git diff --quiet -- profile-3d-contrib/profile-night-rainbow.svg; then
            echo 'No new public contribution activity; graph is already current.'
            exit 0
          fi
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          image = './profile-3d-contrib/profile-night-rainbow.svg'
          pattern = re.escape(image) + r'(?:\?v=[A-Za-z0-9_-]+)?'
          version = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          updated, count = re.subn(pattern, image + '?v=' + version, text)
          if count != 1:
              raise SystemExit(f'Expected one contribution image; found {count}')
          path.write_text(updated, encoding='utf-8')
          print('3D contribution snapshot refreshed at', version)
          PY
      - name: Commit generated visuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh 3D contribution graph"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$((attempt * 2))"
            done
            exit 1
          fi
