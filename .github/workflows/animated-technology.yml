name: Generate animated 3D technology GIF

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_3d_gif.py'
      - '.github/workflows/animated-technology.yml'
  schedule:
    - cron: '10 5 1 * *'

permissions:
  contents: write

concurrency:
  group: profile-repository-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: python -m pip install "Pillow>=11,<13"
      - name: Render looping 3D animation
        run: python scripts/render_3d_gif.py
      - name: Commit generated GIF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/technology-orbit.gif
          if ! git diff --cached --quiet; then
            git commit -m "design(profile): refresh animated 3D technology orbit"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$((attempt * 2))"
            done
            exit 1
          fi
